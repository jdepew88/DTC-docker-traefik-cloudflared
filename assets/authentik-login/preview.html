<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PREVIEW - DTC sign-in picture shortcut (not a sign-in page)</title>
<!--
  Offline preview of the DTC sign-in experience: the real picture, the real script (login-experience.js) and the
  default configuration, with a stand-in for authentik's sign-in card. Nothing here contacts Google or authentik and
  nothing signs anyone in: pressing the button (or completing the picture shortcut) only shows what WOULD happen.
  Open it straight from disk. Add #dtc-calibrate to the address to see the targets and read picture coordinates.
-->
<style>
  :root { --ak-flow-background: url("background.jpg"); }
  html, body { margin: 0; min-height: 100%; font-family: system-ui, "Segoe UI", sans-serif; color: #fff; }
  html { background: #0e0b12; } body { background: transparent; }
  body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
    background-image: var(--ak-flow-background); background-size: cover; background-position: center; background-repeat: no-repeat; }
  .banner { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 6px 12px; background: #b3261e; color: #fff; font: 600 13px/1.3 system-ui; text-align: center; }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 48px 16px 24px; box-sizing: border-box; }
  @media (orientation: portrait) {
    html[data-dtc-login] body::before { background: var(--ak-flow-background) center var(--dtc-picture-top, 64px) / 100% auto no-repeat, #0e0b12; }
    html[data-dtc-login] .stage { place-items: start center; padding-top: calc(var(--dtc-picture-top, 64px) + 100vw / var(--dtc-picture-aspect, 1.5) - 12px); }
  }
  .result { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 11; max-width: 92vw; padding: 12px 16px; border-radius: 12px;
    background: rgba(0,0,0,.85); border: 2px dashed #ffd54a; font: 14px/1.4 system-ui; display: none; }
</style>
<script type="application/json" id="dtc-login-config">
{
  "ownerEmail": "joeydepew@gmail.com",
  "sourceSlug": "google",
  "buttonLabel": "Continue as {email}",
  "pictureShortcut": {
    "enabled": true,
    "tapTimeoutMs": 6000,
    "minTargetRadiusPx": 28,
    "points": [
      { "name": "Left snowfield", "x": 0.185, "y": 0.258, "r": 0.035 },
      { "name": "Right spire", "x": 0.765, "y": 0.215, "r": 0.035 },
      { "name": "Red cliff", "x": 0.895, "y": 0.565, "r": 0.035 }
    ]
  }
}
</script>
<script src="login-experience.js"></script>
</head>
<body>
<div class="banner" data-dtc-ui>PREVIEW ONLY: a stand-in sign-in card. Nothing here signs anyone in or contacts Google.</div>
<div class="stage"><preview-card></preview-card></div>
<div class="result" id="result" role="status" aria-live="polite" data-dtc-ui></div>
<script>
  // A stand-in for authentik's identification stage: a shadow root holding the Google source button, which in authentik
  // would navigate to /source/oauth/login/google/. Here it only reports that, and counts how often it was pressed.
  window.previewGoogleClicks = 0;
  customElements.define('preview-card', class extends HTMLElement {
    connectedCallback() {
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = `
        <style>
          main.pf-c-login__main { box-sizing: border-box; width: min(420px, 92vw); padding: 28px; border-radius: 24px; background: rgba(20, 16, 28, .45);
            border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
          h1 { margin: 0 0 18px; font-size: 22px; font-weight: 600; }
          button { width: 100%; min-height: 48px; border-radius: 14px; font: 600 16px system-ui; cursor: pointer; }
          button[data-dtc-continue] { padding-left: 52px; background: #fff; color: #1f1f1f; border: 1px solid #fff; overflow-wrap: anywhere;
            background-image: radial-gradient(circle at 30px 50%, #4285f4 0 9px, transparent 10px); }
          button:focus-visible { outline: 3px solid #8ab4f8; outline-offset: 3px; }
          .or { text-align: center; opacity: .7; margin: 16px 0; font-size: 13px; }
          label { display: block; font-size: 13px; margin-bottom: 6px; opacity: .9; }
          input { width: 100%; box-sizing: border-box; min-height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25);
            background: rgba(255,255,255,.08); color: #fff; padding: 0 12px; font-size: 15px; margin-bottom: 12px; }
          .local { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); }
        </style>
        <main class="pf-c-login__main">
          <h1>Sign in to jrtechconsult.com</h1>
          <button type="button" name="source-google" class="pf-c-button source-button source-button-promoted" aria-label="Continue with Google">Continue with Google</button>
          <div class="or">or</div>
          <form onsubmit="return false">
            <label for="id">Email or Username</label>
            <input id="id" autocomplete="username">
            <button type="submit" class="local">Log in (preview: does nothing)</button>
          </form>
        </main>`;
      root.querySelector('button[name="source-google"]').addEventListener('click', () => {
        window.previewGoogleClicks += 1;
        const r = document.getElementById('result');
        r.style.display = 'block';
        r.textContent = 'PREVIEW: on the real page this now opens authentik’s Google sign-in (/source/oauth/login/google/), which sends you to Google with login_hint=joeydepew@gmail.com. No sign-in happened here. (pressed ' + window.previewGoogleClicks + 'x)';
      });
    }
  });
</script>
</body>
</html>
