# Shared middlewares. Reference them from a service as <name>@file (services.ps1 -Middleware, web UI).
# Add your own middlewares in another hand-written file in this folder (not svc-*.yml, which is generated).
http:
  middlewares:
    default-headers:
      headers:
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        frameDeny: true
        # Public TLS terminates at Cloudflare; HSTS is safe because every public hostname is HTTPS-only.
        stsSeconds: 31536000
        stsIncludeSubdomains: false
    # gzip/brotli for text responses. Do not use for media streaming or apps that compress themselves.
    compress:
      compress: {}
    # Keeps search engines from indexing a self-hosted app that is published without Cloudflare Access.
    no-index:
      headers:
        customResponseHeaders:
          X-Robots-Tag: noindex, nofollow
